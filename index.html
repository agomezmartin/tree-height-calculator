<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f6f43" />
    <title data-i18n="app.title">Calculadora de altura de árboles</title>
    <meta name="description" content="Herramienta para arboricultores: calcula la altura de árboles con un clinómetro o registra directamente una altura conocida." data-i18n-content="app.description" />
    <link rel="canonical" href="https://agomezmartin.github.io/tree-height-calculator/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Calculadora de altura de árboles" />
    <meta property="og:description" content="Herramienta para arboricultores: calcula la altura de árboles con un clinómetro o registra directamente una altura conocida." />
    <meta property="og:url" content="https://agomezmartin.github.io/tree-height-calculator/" />
    <meta property="og:image" content="https://agomezmartin.github.io/tree-height-calculator/assets/social-preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ilustración de un árbol medido en el campo con clinómetro y registro de altura conocida." />
    <meta property="og:site_name" content="Calculadora de altura de árboles" />
    <meta property="og:locale" content="es_ES" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Calculadora de altura de árboles" />
    <meta name="twitter:description" content="Herramienta para arboricultores: calcula la altura de árboles con un clinómetro o registra directamente una altura conocida." />
    <meta name="twitter:image" content="https://agomezmartin.github.io/tree-height-calculator/assets/social-preview.png" />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="./css/styles.css?v=3" />
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="./js/app.js" defer></script>
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow" data-i18n="app.eyebrow"></p>
        <h1 data-i18n="app.title"></h1>
      </div>
      <label class="language-picker">
        <span data-i18n="language.label"></span>
        <select id="languageSelect" data-i18n-aria-label="language.label">
          <option value="es" data-i18n="language.spanish"></option>
          <option value="en" data-i18n="language.english"></option>
          <option value="ca" data-i18n="language.catalan"></option>
          <option value="eu" data-i18n="language.basque"></option>
          <option value="gl" data-i18n="language.galician"></option>
          <option value="ca-val" data-i18n="language.valencian"></option>
        </select>
      </label>
    </header>

    <main class="app-shell">
      <section class="panel form-panel" aria-labelledby="form-title">
        <div class="panel-header">
          <h2 id="form-title" data-i18n="tree.newMeasurement"></h2>
        </div>

        <form id="measurementForm" novalidate>
          <fieldset>
            <legend data-i18n="measurement.type"></legend>
            <div class="radio-group" role="radiogroup" data-i18n-aria-label="measurement.type">
              <label class="choice">
                <input type="radio" name="measurementType" value="clinometer" checked />
                <span><strong data-i18n="measurement.typeClinometer"></strong></span>
              </label>
              <label class="choice">
                <input type="radio" name="measurementType" value="manual" />
                <span><strong data-i18n="measurement.typeManual"></strong></span>
              </label>
            </div>
          </fieldset>

          <fieldset>
            <legend data-i18n="tree.section"></legend>

            <div class="field-grid">
              <label class="field">
                <span data-i18n="tree.id"></span>
                <input id="treeId" name="treeId" type="text" maxlength="80" data-i18n-placeholder="tree.idPlaceholder" />
              </label>

              <label class="field">
                <span data-i18n="tree.date"></span>
                <input id="measurementDate" name="measurementDate" type="date" />
              </label>
            </div>

            <label class="field">
              <span data-i18n="tree.notes"></span>
              <textarea id="notes" name="notes" rows="3" data-i18n-placeholder="tree.notesPlaceholder"></textarea>
            </label>
          </fieldset>

          <fieldset id="manualMeasurementFields" hidden>
            <legend data-i18n="measurement.manualSection"></legend>
            <label class="field">
              <span data-i18n="measurement.manualHeight"></span>
              <input id="manualHeight" name="manualHeight" type="text" inputmode="decimal" autocomplete="off" data-i18n-placeholder="measurement.manualHeightExample" />
            </label>
          </fieldset>

          <fieldset id="distanceMethodFields">
            <legend data-i18n="distance.section"></legend>

            <div class="radio-group" role="radiogroup" data-i18n-aria-label="distance.groupLabel">
              <label class="choice">
                <input type="radio" name="distanceMethod" value="horizontal" checked />
                <span>
                  <strong data-i18n="distance.horizontal"></strong>
                  <small data-i18n="distance.horizontalHelp"></small>
                </span>
              </label>

              <label class="choice">
                <input type="radio" name="distanceMethod" value="slope" />
                <span>
                  <strong data-i18n="distance.slope"></strong>
                  <small data-i18n="distance.slopeHelp"></small>
                </span>
              </label>
            </div>
          </fieldset>

          <fieldset id="clinometerMeasurementFields">
            <legend data-i18n="measurement.section"></legend>

            <div class="field-grid">
              <label class="field">
                <span data-i18n="measurement.distance"></span>
                <input id="distance" name="distance" type="number" step="0.01" min="0.01" required data-i18n-placeholder="measurement.distanceExample" />
              </label>

              <label class="field">
                <span data-i18n="measurement.clinometer"></span>
                <input id="clinometerPercent" name="clinometerPercent" type="number" step="0.01" required data-i18n-placeholder="measurement.clinometerExample" />
              </label>

              <label class="field">
                <span data-i18n="measurement.slope"></span>
                <input id="terrainSlopePercent" name="terrainSlopePercent" type="number" step="0.01" required data-i18n-placeholder="measurement.slopeExample" />
              </label>

              <label class="field">
                <span data-i18n="measurement.observerHeight"></span>
                <input id="observerHeight" name="observerHeight" type="number" step="0.01" min="0" required data-i18n-placeholder="measurement.observerHeightExample" />
              </label>
            </div>
          </fieldset>

          <fieldset>
            <legend data-i18n="gps.section"></legend>

            <p class="location-help" data-i18n="gps.intro"></p>
            <button id="getLocationButton" class="secondary-button location-button" type="button" data-i18n="gps.getLocation"></button>
            <p id="locationStatus" class="location-status" role="status" aria-live="polite" data-i18n="gps.optional"></p>

            <div class="field-grid">
              <label class="field">
                <span data-i18n="gps.latitude"></span>
                <input id="latitude" name="latitude" type="text" inputmode="decimal" autocomplete="off" data-i18n-placeholder="gps.latitudePlaceholder" />
              </label>

              <label class="field">
                <span data-i18n="gps.longitude"></span>
                <input id="longitude" name="longitude" type="text" inputmode="decimal" autocomplete="off" data-i18n-placeholder="gps.longitudePlaceholder" />
              </label>
            </div>

            <p class="location-help map-help" data-i18n="gps.mapHelp"></p>
            <label class="field map-style-picker">
              <span data-i18n="gps.mapStyle"></span>
              <select id="mapStyleSelect" data-i18n-aria-label="gps.mapStyle">
                <option value="standard" data-i18n="gps.mapStyleStandard"></option>
                <option value="satellite" data-i18n="gps.mapStyleSatellite"></option>
                <option value="topographic" data-i18n="gps.mapStyleTopographic"></option>
              </select>
            </label>
            <div id="locationMap" class="location-map" role="region" data-i18n-aria-label="gps.mapLabel"></div>
            <p id="mapStatus" class="location-status" role="status" aria-live="polite" data-i18n="gps.mapInitialStatus"></p>
            <p class="map-attribution"><span data-i18n="gps.mapAttribution"></span> <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer" data-i18n="gps.osmContributors"></a></p>
          </fieldset>

          <div class="form-actions">
            <button id="calculateButton" class="primary-button" type="submit" data-i18n="action.calculate"></button>
            <button id="calculateManualButton" class="primary-button" type="button" data-i18n="action.showManualHeight" hidden></button>
            <button id="saveButton" class="secondary-button" type="button" data-i18n="action.save"></button>
            <button id="exportButton" class="ghost-button" type="button" data-i18n="action.exportExcel"></button>
          </div>

          <div id="formError" class="message error" aria-live="assertive" hidden></div>
        </form>
      </section>

      <section class="panel result-panel" aria-labelledby="result-title">
        <div class="panel-header compact">
          <h2 id="result-title" data-i18n="result.title"></h2>
        </div>

        <div id="treeHeightResult" class="result-value" aria-live="polite"></div>
        <p class="result-label" data-i18n="result.estimatedHeight"></p>

        <div class="summary-card">
          <h3 data-i18n="result.summary"></h3>
          <dl id="resultSummary" class="summary-list">
            <div><dt data-i18n="result.method"></dt><dd data-i18n="common.notAvailable"></dd></div>
            <div><dt data-i18n="result.inputDistance"></dt><dd data-i18n="common.notAvailable"></dd></div>
            <div><dt data-i18n="result.horizontalDistance"></dt><dd data-i18n="common.notAvailable"></dd></div>
            <div><dt data-i18n="result.clinometer"></dt><dd data-i18n="common.notAvailable"></dd></div>
            <div><dt data-i18n="result.slope"></dt><dd data-i18n="common.notAvailable"></dd></div>
            <div><dt data-i18n="result.elevationDifference"></dt><dd data-i18n="common.notAvailable"></dd></div>
            <div><dt data-i18n="result.instrumentHeight"></dt><dd data-i18n="common.notAvailable"></dd></div>
          </dl>
        </div>

        <div class="formula-card">
          <h3 data-i18n="result.explanationTitle"></h3>
          <p id="formulaExplanation" data-i18n="result.explanation"></p>
        </div>

        <div class="diagram-wrap">
          <svg id="measurementDiagram" viewBox="0 0 420 220" role="img" aria-labelledby="diagramTitle">
            <title id="diagramTitle" data-i18n="result.diagramTitle"></title>
          </svg>
        </div>
      </section>
    </main>

    <section class="panel table-panel" aria-labelledby="table-title">
      <div class="panel-header compact">
        <h2 id="table-title" data-i18n="table.title"></h2>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-i18n="table.id"></th>
              <th data-i18n="table.measurementType"></th>
              <th data-i18n="table.date"></th>
              <th data-i18n="table.method"></th>
              <th data-i18n="table.distance"></th>
              <th data-i18n="table.clinometer"></th>
              <th data-i18n="table.slope"></th>
              <th data-i18n="table.instrumentHeight"></th>
              <th data-i18n="table.calculatedHeight"></th>
              <th data-i18n="table.latitude"></th>
                <th data-i18n="table.longitude"></th>
              <th data-i18n="table.actions"></th>
            </tr>
          </thead>
          <tbody id="measurementTableBody"></tbody>
        </table>
      </div>
    </section>

    <footer class="app-footer">
      <span class="footer-mark" aria-hidden="true" data-i18n="footer.mark"></span>
      <p data-i18n="footer.appName"></p>
      <span class="footer-divider" aria-hidden="true"></span>
      <p><span data-i18n="footer.developer"></span> <a href="https://github.com/agomezmartin" target="_blank" rel="noopener noreferrer" data-i18n="footer.developerName"></a></p>
    </footer>
  </body>
</html>
